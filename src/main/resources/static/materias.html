<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRUD Materias</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-4">
  <a href="index.html" class="btn btn-link mb-3">&larr; Volver al Menú</a>

  <div class="row">
    <!-- Formulario -->
    <div class="col-md-4 mb-4">
      <div class="card shadow p-4">
        <h4 id="form-title" class="mb-3 text-primary">Agregar Materia</h4>
        <form id="materia-form">
          <input type="hidden" id="materia-id">
          <div class="mb-3">
            <label for="nombre" class="form-label">Nombre de la Materia</label>
            <input type="text" class="form-control" id="nombre" required>
          </div>
          <button type="submit" class="btn btn-success w-100" id="btn-guardar">Guardar</button>
          <button type="button" class="btn btn-secondary w-100 mt-2 d-none" id="btn-cancelar" onclick="limpiarFormulario()">Cancelar</button>
        </form>
      </div>
    </div>

    <!-- Tabla -->
    <div class="col-md-8">
      <div class="card shadow p-4">
        <h2 class="mb-4 text-primary">📖 Catálogo de Materias</h2>
        <div class="table-responsive">
          <table class="table table-striped table-hover align-middle">
            <thead class="table-dark">
            <tr>
              <th>ID</th>
              <th>Materia</th>
              <th>Acciones</th>
            </tr>
            </thead>
            <tbody id="tabla-materias"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  const API_URL = '/api/materias';
  document.addEventListener("DOMContentLoaded", cargarMaterias);

  function cargarMaterias() {
    fetch(API_URL)
            .then(res => res.json())
            .then(data => {
              const tbody = document.getElementById('tabla-materias');
              tbody.innerHTML = '';
              data.forEach(m => {
                tbody.innerHTML += `<tr>
                            <td>${m.id}</td>
                            <td>${m.nombre}</td>
                            <td>
                                <button class="btn btn-warning btn-sm me-1" onclick="prepararActualizar(${m.id}, '${m.nombre}')">Editar</button>
                                <button class="btn btn-danger btn-sm" onclick="eliminar(${m.id})">Eliminar</button>
                            </td>
                        </tr>`;
              });
            })
            .catch(err => console.error('Error:', err));
  }

  document.getElementById('materia-form').addEventListener('submit', function(e) {
    e.preventDefault();
    const id = document.getElementById('materia-id').value;
    const materia = { nombre: document.getElementById('nombre').value };

    const method = id ? 'PUT' : 'POST';
    const url = id ? `${API_URL}/${id}` : API_URL;

    fetch(url, {
      method: method,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(materia)
    })
            .then(res => {
              if (res.ok) { limpiarFormulario(); cargarMaterias(); }
              else { alert('Error al guardar'); }
            });
  });

  function prepararActualizar(id, nombre) {
    document.getElementById('materia-id').value = id;
    document.getElementById('nombre').value = nombre;
    document.getElementById('form-title').textContent = 'Editar Materia';
    document.getElementById('btn-guardar').textContent = 'Actualizar';
    document.getElementById('btn-cancelar').classList.remove('d-none');
  }

  function eliminar(id) {
    if (confirm('¿Deseas eliminar esta materia?')) {
      fetch(`${API_URL}/${id}`, { method: 'DELETE' })
              .then(res => { if (res.ok || res.status === 204) cargarMaterias(); });
    }
  }

  function limpiarFormulario() {
    document.getElementById('materia-id').value = '';
    document.getElementById('materia-form').reset();
    document.getElementById('form-title').textContent = 'Agregar Materia';
    document.getElementById('btn-guardar').textContent = 'Guardar';
    document.getElementById('btn-cancelar').classList.add('d-none');
  }
</script>
</body>
</html>
