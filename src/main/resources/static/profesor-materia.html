<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRUD Profesor - Materia</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-4">
  <a href="index.html" class="btn btn-link mb-3">&larr; Volver al Menú</a>

  <div class="row">
    <!-- Formulario -->
    <div class="col-md-4 mb-4">
      <div class="card shadow p-4">
        <h4 id="form-title" class="mb-3 text-primary">Asignar Profesor a Materia</h4>
        <form id="pm-form">
          <input type="hidden" id="pm-id">
          <div class="mb-3">
            <label for="profesor-select" class="form-label">Profesor</label>
            <select class="form-select" id="profesor-select" required></select>
          </div>
          <div class="mb-3">
            <label for="materia-select" class="form-label">Materia</label>
            <select class="form-select" id="materia-select" required></select>
          </div>
          <button type="submit" class="btn btn-success w-100" id="btn-guardar">Guardar</button>
          <button type="button" class="btn btn-secondary w-100 mt-2 d-none" id="btn-cancelar" onclick="limpiarFormulario()">Cancelar</button>
        </form>
      </div>
    </div>

    <!-- Tabla -->
    <div class="col-md-8">
      <div class="card shadow p-4">
        <h2 class="mb-4 text-primary">📚 Asignaciones Profesor - Materia</h2>
        <div class="table-responsive">
          <table class="table table-striped table-hover align-middle">
            <thead class="table-dark">
            <tr>
              <th>ID</th>
              <th>Profesor</th>
              <th>Materia</th>
              <th>Acciones</th>
            </tr>
            </thead>
            <tbody id="tabla-pm"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  const API_URL = '/api/profesormateria';
  document.addEventListener("DOMContentLoaded", () => {
    cargarCatalogos();
    cargarAsignaciones();
  });

  function cargarCatalogos() {
    fetch('/api/profesores').then(r => r.json()).then(data => {
      const sel = document.getElementById('profesor-select');
      sel.innerHTML = '<option value="">Seleccione Profesor...</option>';
      data.forEach(p => sel.innerHTML += `<option value="${p.id}">${p.nombre}</option>`);
    });
    fetch('/api/materias').then(r => r.json()).then(data => {
      const sel = document.getElementById('materia-select');
      sel.innerHTML = '<option value="">Seleccione Materia...</option>';
      data.forEach(m => sel.innerHTML += `<option value="${m.id}">${m.nombre}</option>`);
    });
  }

  function cargarAsignaciones() {
    fetch(API_URL)
            .then(res => res.json())
            .then(data => {
              const tbody = document.getElementById('tabla-pm');
              tbody.innerHTML = '';
              data.forEach(item => {
                const profNom = item.profesor ? item.profesor.nombre : 'N/A';
                const matNom = item.materia ? item.materia.nombre : 'N/A';
                const profId = item.profesor ? item.profesor.id : '';
                const matId = item.materia ? item.materia.id : '';

                tbody.innerHTML += `<tr>
                            <td>${item.id}</td>
                            <td>${profNom}</td>
                            <td>${matNom}</td>
                            <td>
                                <button class="btn btn-warning btn-sm me-1" onclick="prepararActualizar(${item.id}, ${profId}, ${matId})">Editar</button>
                                <button class="btn btn-danger btn-sm" onclick="eliminar(${item.id})">Eliminar</button>
                            </td>
                        </tr>`;
              });
            });
  }

  document.getElementById('pm-form').addEventListener('submit', function(e) {
    e.preventDefault();
    const id = document.getElementById('pm-id').value;
    const payload = {
      profesor: { id: parseInt(document.getElementById('profesor-select').value) },
      materia: { id: parseInt(document.getElementById('materia-select').value) }
    };

    const method = id ? 'PUT' : 'POST';
    const url = id ? `${API_URL}/${id}` : API_URL;

    fetch(url, {
      method: method,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    })
            .then(res => {
              if (res.ok) { limpiarFormulario(); cargarAsignaciones(); }
              else { alert('Error al guardar'); }
            });
  });

  function prepararActualizar(id, profId, matId) {
    document.getElementById('pm-id').value = id;
    document.getElementById('profesor-select').value = profId;
    document.getElementById('materia-select').value = matId;
    document.getElementById('form-title').textContent = 'Editar Asignación';
    document.getElementById('btn-guardar').textContent = 'Actualizar';
    document.getElementById('btn-cancelar').classList.remove('d-none');
  }

  function eliminar(id) {
    if (confirm('¿Deseas borrar esta asignación?')) {
      fetch(`${API_URL}/${id}`, { method: 'DELETE' })
              .then(res => { if (res.ok || res.status === 204) cargarAsignaciones(); });
    }
  }

  function limpiarFormulario() {
    document.getElementById('pm-id').value = '';
    document.getElementById('pm-form').reset();
    document.getElementById('form-title').textContent = 'Asignar Profesor a Materia';
    document.getElementById('btn-guardar').textContent = 'Guardar';
    document.getElementById('btn-cancelar').classList.add('d-none');
  }
</script>
</body>
</html>
